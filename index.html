<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Happy Anniversary</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{--ink:#0d0718;--plum:#2a1346;--rose:#ff7a9c;--gold:#ffd68a;--mist:#f3e6ff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 30%,var(--plum),var(--ink) 75%);color:var(--mist);font-family:'Jost',system-ui,sans-serif;font-weight:300;overflow:hidden}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.start,.msg{position:fixed;left:0;right:0;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.start{inset:0;justify-content:center;gap:14px;z-index:2;transition:opacity .8s}
.start.gone{opacity:0;pointer-events:none}
.start h1{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.6rem,10vw,4rem);margin:0;color:var(--gold)}
.start p{margin:0 0 8px;opacity:.8}
button{font:inherit;font-weight:400;color:var(--ink);background:var(--gold);border:0;border-radius:999px;padding:12px 34px;cursor:pointer;transition:transform .2s,box-shadow .2s}
button:hover{transform:scale(1.04);box-shadow:0 0 24px rgba(255,214,138,.5)}
button:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
.msg{top:54%;z-index:1;pointer-events:none}
.msg>*{opacity:0;transform:translateY(14px);transition:opacity 1.4s,transform 1.4s}
.msg.show>*{opacity:1;transform:none}
.msg.show>:nth-child(2){transition-delay:.9s}.msg.show>:nth-child(3){transition-delay:1.8s}.msg.show>:nth-child(4){transition-delay:2.8s}.msg.show>:nth-child(5){transition-delay:4s}
.msg h2{font-family:'Pinyon Script',cursive;font-weight:400;font-size:clamp(2.6rem,11vw,5rem);line-height:1.05;margin:0;color:var(--gold);text-shadow:0 0 28px rgba(255,214,138,.45)}
.msg .to{font-size:clamp(1.1rem,4vw,1.5rem);margin:6px 0 0;color:var(--rose)}
.msg .text{max-width:34ch;line-height:1.7;margin:14px 0 0;font-size:clamp(1rem,3.6vw,1.2rem)}
.msg .from{font-family:'Pinyon Script',cursive;font-size:clamp(1.6rem,6vw,2.2rem);margin:10px 0 0;color:var(--gold)}
.actions{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:16px}
.actions button{pointer-events:auto}
#open{background:var(--rose);color:var(--ink);padding:13px 38px;animation:beat 1.6s ease-in-out infinite}
@keyframes beat{0%,100%{transform:scale(1);box-shadow:0 0 0 0 rgba(255,122,156,.5)}50%{transform:scale(1.06);box-shadow:0 0 0 14px rgba(255,122,156,0)}}
#again{background:transparent;color:var(--mist);border:1px solid rgba(243,230,255,.4);padding:6px 18px;font-size:.85rem}
.wrap{position:fixed;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(13,7,24,.8);opacity:0;pointer-events:none;transition:opacity .6s}
.wrap.open{opacity:1;pointer-events:auto}
.card{width:min(460px,100%);max-height:84vh;overflow:auto;padding:38px 30px 30px;text-align:center;background:linear-gradient(160deg,#3a1b5c,#1b0d2e);border:1px solid rgba(255,214,138,.55);border-radius:6px;box-shadow:0 0 60px rgba(255,122,156,.25);transform-origin:top center;transform:perspective(900px) rotateX(-75deg) scale(.9);transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.wrap.open .card{transform:none}
.card h3{font-family:'Pinyon Script',cursive;font-weight:400;font-size:2.4rem;margin:0 0 14px;color:var(--gold)}
.card p{line-height:1.85;margin:0 0 14px;font-size:1.05rem}
.card .sign{font-family:'Pinyon Script',cursive;font-size:1.9rem;color:var(--gold);margin:22px 0 18px}
@media (prefers-reduced-motion:reduce){#open{animation:none}.card{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-hidden="true"></canvas>

<div class="start" id="start">
  <h1 id="startTitle"></h1>
  <p>I made you something bebe.</p>
  <button id="go">Please press to begin mon coeur</button>
</div>

<div class="msg" id="msg" aria-live="polite">
  <h2>Happy Anniversary</h2>
  <div class="to" id="toEl"></div>
  <div class="text" id="textEl"></div>
  <div class="from" id="fromEl"></div>
  <div class="actions">
    <button id="open">Click me</button>
    <button id="again">Watch again</button>
  </div>
</div>

<div class="wrap" id="wrap" role="dialog" aria-modal="true" aria-labelledby="cardTitle">
  <div class="card">
    <h3 id="cardTitle"></h3>
    <div id="cardBody"></div>
    <div class="sign" id="cardSign"></div>
    <button id="close">Close</button>
  </div>
</div>

<script>
/* ============================================================
   EDIT THIS PART: your names and your messages.
   Keep the quote marks and commas; just change the words inside.
   ============================================================ */
var CONFIG = {
  herName: "Mon coeur, Awisibea oooo",          // her name
  yourName: "You know who, ma",        // your name
  shortNote: "Every day with you is my favorite chapter.",   // shows under "Happy Anniversary"
  cardTitle: "My sweet angel,",        // first line of the card
  cardMessage: [                // one entry per paragraph; add or remove lines as you like
    "It has already been 7 months and it feels like youve always been there for me. From caring to loving to advising to taking care of me. For having hope when I lost hope.",
    "For always believing in us.Looks like Ill have to make the message a lil short Ill send the rest on whatsapp :). I really love you bebe and I appreciate you for being there with me during these hard times. I really want to thank you for everything, for laughing for being funny and for looking past my huge flaws.",
    "Thank you Awisibea, I pray we'll always be together, try new things together and live together, idek if that made sense. Thanks for everything.I love you mon coeur."
  ],
  signOff: "Always yours mummy,"     // your name is added after this
};
/* ============================================================ */

(function(){
var cv=document.getElementById('c'),ctx=cv.getContext('2d');
var $=function(i){return document.getElementById(i)};
var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var W,H,dpr,bg=[],nodes=[],petals=[],t0=0,running=false,revealed=false,N=32;

function clamp(x){return Math.max(0,Math.min(1,x))}
function ease(x){return 1-Math.pow(1-x,3)}

function layout(){
  dpr=window.devicePixelRatio||1;W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  var s=Math.min(W*0.8/34,H*0.32/29),cx=W/2,cy=H*0.26;
  for(var i=0;i<N;i++){
    var a=i/N*Math.PI*2,x=16*Math.pow(Math.sin(a),3),
        y=-(13*Math.cos(a)-5*Math.cos(2*a)-2*Math.cos(3*a)-Math.cos(4*a));
    if(!nodes[i])nodes[i]={sx:Math.random()*W,sy:Math.random()*H};
    nodes[i].tx=cx+x*s;nodes[i].ty=cy+y*s;
  }
}
function seed(){
  bg=[];for(var i=0;i<130;i++)bg.push({x:Math.random(),y:Math.random(),r:Math.random()*1.3+.3,p:Math.random()*6.28,v:Math.random()*1.5+.5});
  nodes=[];petals=[];layout();
}
function pos(n,t,i){
  var p=ease(clamp((t-i*0.07-0.3)/1.8));
  return {x:n.sx+(n.tx-n.sx)*p,y:n.sy+(n.ty-n.sy)*p,p:p};
}
function drawBg(t){
  for(var i=0;i<bg.length;i++){var s=bg[i],a=.35+.35*Math.sin(t*s.v+s.p);
    ctx.fillStyle='rgba(243,230,255,'+a+')';ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill();}
}

function frame(now){
  if(!running)return;
  var t=(now-t0)/1000;
  ctx.clearRect(0,0,W,H);
  drawBg(t);
  var pts=nodes.map(function(n,i){return pos(n,t,i)});
  var lp=clamp((t-4)/2.6),segs=lp*N,full=Math.floor(segs);
  ctx.lineWidth=1.6;ctx.strokeStyle='rgba(255,214,138,.85)';ctx.shadowColor='rgba(255,214,138,.9)';ctx.shadowBlur=10;
  ctx.beginPath();
  for(var k=0;k<=Math.min(full,N-1);k++){
    var A=pts[k],B=pts[(k+1)%N],f=k<full?1:segs-full;
    if(f<=0)continue;ctx.moveTo(A.x,A.y);ctx.lineTo(A.x+(B.x-A.x)*f,A.y+(B.y-A.y)*f);
  }
  ctx.stroke();
  var pulse=lp>=1?1+.025*Math.sin((t-6.6)*2.6):1;
  if(lp>=1){
    ctx.shadowBlur=0;ctx.fillStyle='rgba(255,122,156,'+(.16*clamp((t-6.6)/1.5))+')';
    ctx.beginPath();pts.forEach(function(p,i){i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y)});ctx.closePath();ctx.fill();
  }
  ctx.shadowColor='rgba(255,214,138,1)';ctx.shadowBlur=14;ctx.fillStyle='#fff2cf';
  pts.forEach(function(p){ctx.beginPath();ctx.arc(p.x,p.y,(2.2+p.p*1.2)*pulse,0,6.283);ctx.fill()});
  ctx.shadowBlur=0;
  if(!revealed&&t>=6.4){revealed=true;$('msg').classList.add('show')}
  if(t>6.4&&Math.random()<(reduce?.02:.12))petals.push({x:Math.random()*W,y:-20,s:Math.random()*12+8,v:Math.random()*40+30,ph:Math.random()*6.28,c:Math.random()<.5?'#ff7a9c':'#ffd68a'});
  petals=petals.filter(function(p){return p.y<H+30});
  petals.forEach(function(p){
    p.y+=p.v/60;var x=p.x+Math.sin(t*1.2+p.ph)*24;
    ctx.globalAlpha=.55;ctx.fillStyle=p.c;ctx.font=p.s+'px serif';ctx.fillText('\u2665',x,p.y);
  });
  ctx.globalAlpha=1;
  requestAnimationFrame(frame);
}

function fillText(){
  $('startTitle').textContent='For '+CONFIG.herName;
  $('toEl').textContent='for '+CONFIG.herName;
  $('textEl').textContent=CONFIG.shortNote;
  $('fromEl').textContent=CONFIG.signOff+' '+CONFIG.yourName;
  $('cardTitle').textContent=CONFIG.cardTitle;
  $('cardSign').textContent=CONFIG.signOff+' '+CONFIG.yourName;
  var body=$('cardBody');body.textContent='';
  CONFIG.cardMessage.forEach(function(line){var p=document.createElement('p');p.textContent=line;body.appendChild(p)});
}

function play(){
  $('start').classList.add('gone');
  $('msg').classList.remove('show');revealed=false;
  seed();running=true;t0=performance.now()-(reduce?9000:0);
  requestAnimationFrame(frame);
}
function openCard(){$('wrap').classList.add('open');$('close').focus()}
function closeCard(){$('wrap').classList.remove('open');$('open').focus()}

$('go').addEventListener('click',play);
$('again').addEventListener('click',function(){running=false;setTimeout(play,60)});
$('open').addEventListener('click',openCard);
$('close').addEventListener('click',closeCard);
$('wrap').addEventListener('click',function(e){if(e.target===$('wrap'))closeCard()});
document.addEventListener('keydown',function(e){if(e.key==='Escape')closeCard()});
addEventListener('resize',function(){if(running)layout()});

fillText();seed();
(function idle(now){
  if(running)return;
  ctx.clearRect(0,0,W,H);drawBg(now/1000);
  requestAnimationFrame(idle);
})(0);
})();
</script>
</body>
</html>
